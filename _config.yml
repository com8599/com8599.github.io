title: Tulipping
description: 읽고, 구조만 남기는 아키텍처 노트.
url: https://com8599.github.io
baseurl: ""
lang: ko

author:
  name: tulipLee
  email: com8599@gmail.com

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
timezone: Asia/Seoul

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
