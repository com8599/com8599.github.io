title: Tulipping
description: 두근두근 개발일지
url: https://com8599.github.io
baseurl: ""
lang: ko
locale: ko_KR

author:
  name: tulipLee
  email: com8599@gmail.com

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
timezone: Asia/Seoul

# 조회수 저장용 Firebase 프로젝트. 비워 두면 집계하지 않는다.
# 보안 규칙은 firestore.rules 파일을 Firebase 콘솔에 그대로 붙여 넣는다.
firebase:
  api_key: "AIzaSyDPQOzKfBMsGN6E0dI7gF0YtHkqfkPbsV0"
  project_id: "myapplication-c0205"

# 검색 엔진 소유 확인 코드. 각 서비스에서 받은 content 값만 넣는다.
# 코드를 받으면 아래 주석을 풀고 값을 넣는다.
# webmaster_verifications:
#   google: ""
#   bing: ""
naver_site_verification: ""

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - .bundle
  - firestore.rules
