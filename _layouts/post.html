---
layout: default
---
<article class="wrap post">
  <header class="post-head">
    {% if page.tags.size > 0 %}
      <ul class="tags">
        {% for tag in page.tags %}
          <li><a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a></li>
        {% endfor %}
      </ul>
    {% endif %}
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
